<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naplánuj to | Backend Test UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        #map { height: 400px; width: 100%; border-radius: 0.5rem; z-index: 1; }
    </style>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
</head>
<body class="text-slate-800 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-extrabold mb-8 text-indigo-900">Naplánuj to API Tester</h1>
        
        <div class="bg-white p-6 rounded-xl shadow border border-slate-100 mb-8">
            <h2 class="text-xl font-bold mb-4">1. Nastavení API Požadavku</h2>
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Město</label>
                    <select id="loc-select" class="w-full bg-slate-50 border border-slate-200 rounded p-2"></select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Datum (Dnes)</label>
                    <input type="date" id="date-input" class="w-full bg-slate-50 border border-slate-200 rounded p-2">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Čas Od</label>
                    <input type="time" id="time-from" value="10:00" class="w-full bg-slate-50 border border-slate-200 rounded p-2">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Čas Do</label>
                    <input type="time" id="time-to" value="16:00" class="w-full bg-slate-50 border border-slate-200 rounded p-2">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Doprava</label>
                    <select id="transport" class="w-full bg-slate-50 border border-slate-200 rounded p-2">
                        <option value="WALK">🚶 Pěšky</option>
                        <option value="BIKE">🚲 Kolo</option>
                        <option value="CAR">🚗 Auto</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Typ trasy</label>
                    <select id="route-type" class="w-full bg-slate-50 border border-slate-200 rounded p-2">
                        <option value="ONE_WAY">Jednosměrně (jen tam)</option>
                        <option value="LOOP">Okruh (zpět do výchozího bodu)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Preference (Kombinace)</label>
                    <select id="interests" multiple class="w-full bg-slate-50 border border-slate-200 rounded p-2 h-24">
                        <option value="SIGHTSEEING" selected>Památky (Sightseeing)</option>
                        <option value="GASTRO" selected>Gastro / Káva</option>
                        <option value="RUNNING">Běh (Running)</option>
                        <option value="FESTIVAL">Festivaly</option>
                        <option value="PARK">Parky / Příroda</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Rozpočet (Kč, prázdné = bez limitu)</label>
                    <input type="number" id="budget-max" min="0" step="50" placeholder="např. 500" class="w-full bg-slate-50 border border-slate-200 rounded p-2">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Max. čas na cestě (min)</label>
                    <input type="number" id="max-travel" min="0" step="5" placeholder="bez limitu" class="w-full bg-slate-50 border border-slate-200 rounded p-2">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Obtížnost</label>
                    <select id="difficulty" class="w-full bg-slate-50 border border-slate-200 rounded p-2">
                        <option value="EASY">Lehká</option>
                        <option value="MEDIUM">Střední</option>
                        <option value="HARD" selected>Náročná (vše)</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-6 mb-4 text-sm font-semibold">
                <label class="flex items-center gap-2"><input type="checkbox" id="willing-pay" checked> Jsem ochoten platit vstupné</label>
                <label class="flex items-center gap-2"><input type="checkbox" id="has-children"> Jedu s dětmi</label>
            </div>

            <button id="btn-generate" class="w-full bg-indigo-600 text-white font-bold py-3 rounded hover:bg-indigo-700">Vygenerovat přes Backend</button>
        </div>

        <div id="results" class="hidden">
            <h2 class="text-xl font-bold mb-4">2. Odpověď z API (Itinerář)</h2>
            <div id="itinerary" class="space-y-4 mb-8"></div>
            
            <h2 class="text-xl font-bold mb-4">3. Mapa Trasy a Navigace</h2>
            <div id="map" class="shadow border border-slate-200 mb-4"></div>
            <a id="nav-btn" href="#" target="_blank" class="block text-center w-full bg-green-600 text-white font-bold py-4 rounded-xl hover:bg-green-700 shadow-lg text-lg mb-8">
                📍 Spustit navigaci v Google Maps
            </a>
            
            <h2 class="text-xl font-bold mb-4 mt-8">4. RAW Waypoints (Pro vývojáře)</h2>
            <pre id="raw-json" class="bg-slate-900 text-green-400 p-4 rounded-xl text-sm overflow-x-auto"></pre>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script>
        let mapInstance = null; // Globální instance mapy

        document.addEventListener('DOMContentLoaded', async () => {
            // Lokální datum (toISOString vrací UTC -> kolem půlnoci by to byl jiný den)
            const _d = new Date();
            const todayStr = `${_d.getFullYear()}-${String(_d.getMonth() + 1).padStart(2, '0')}-${String(_d.getDate()).padStart(2, '0')}`;
            const dateInput = document.getElementById('date-input');
            const timeFromInput = document.getElementById('time-from');
            const timeToInput = document.getElementById('time-to');
            
            dateInput.value = todayStr;
            dateInput.min = todayStr; // Zabrání výběru data v minulosti
            
            // Funkce pro aktualizaci minimálního času
            function updateMinTime() {
                if (dateInput.value === todayStr) {
                    const now = new Date();
                    const currentHours = now.getHours().toString().padStart(2, '0');
                    const currentMinutes = now.getMinutes().toString().padStart(2, '0');
                    const currentTime = `${currentHours}:${currentMinutes}`;
                    timeFromInput.min = currentTime;
                    
                    // Pokud je aktuálně nastavený čas v minulosti, posuneme ho na teď
                    if (timeFromInput.value < timeFromInput.min) {
                        timeFromInput.value = timeFromInput.min;
                    }
                } else {
                    timeFromInput.removeAttribute('min');
                }
                
                // Zajistíme, aby "Čas Do" dával smysl hned po načtení stránky
                if (timeToInput.value <= timeFromInput.value) {
                    let [h, m] = timeFromInput.value.split(':').map(Number);
                    h += 2; // Automaticky předvyplníme +2 hodiny na výlet
                    if (h > 23) { h = 23; m = 59; }
                    timeToInput.value = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
                }
            }
            
            // Nedovolí ani fyzicky ponechat vybraný zpětný čas (okamžitě ho přenastaví zpět)
            timeFromInput.addEventListener('change', (e) => {
                if (dateInput.value === todayStr) {
                    const now = new Date();
                    const currentHours = now.getHours().toString().padStart(2, '0');
                    const currentMinutes = now.getMinutes().toString().padStart(2, '0');
                    const currentTime = `${currentHours}:${currentMinutes}`;
                    if (e.target.value < currentTime) {
                        e.target.value = currentTime;
                    }
                }
                
                // Zajistí, že "Čas Do" není menší než "Čas Od"
                if (timeToInput.value <= e.target.value) {
                    timeToInput.value = e.target.value;
                }
            });

            timeToInput.addEventListener('change', (e) => {
                // "Čas Do" nesmí být menší než "Čas Od"
                if (e.target.value <= timeFromInput.value) {
                    e.target.value = timeFromInput.value;
                }
                // Maximální hodnota do půlnoci (což standardní input type="time" omezuje na 23:59, ale raději to podchytíme)
                if (e.target.value > "23:59") {
                    e.target.value = "23:59";
                }
            });
            
            dateInput.addEventListener('change', updateMinTime);
            updateMinTime(); // Inicializace při načtení
            
            try {
                const res = await fetch('http://localhost:8080/api/locations');
                const data = await res.json();
                const sel = document.getElementById('loc-select');
                data.forEach(l => {
                    const opt = document.createElement('option');
                    opt.value = l.id; opt.textContent = l.name;
                    sel.appendChild(opt);
                });
            } catch(e) { alert("Nelze načíst lokace. Běží API?"); }

            document.getElementById('btn-generate').addEventListener('click', async () => {
                const date = document.getElementById('date-input').value;
                const timeFrom = document.getElementById('time-from').value;
                
                // Přísná validace času na frontendu těsně před odesláním (aby se zabránilo odeslání, pokud stránka byla dlouho otevřená)
                if (date === todayStr) {
                    const now = new Date();
                    const currentHours = now.getHours().toString().padStart(2, '0');
                    const currentMinutes = now.getMinutes().toString().padStart(2, '0');
                    const currentTime = `${currentHours}:${currentMinutes}`;
                    
                    if (timeFrom < currentTime) {
                        alert("Zablokováno front-endem: Nelze naplánovat trasu do minulosti! Čas byl automaticky posunut na aktuální.");
                        document.getElementById('time-from').value = currentTime;
                        return; // Přeruší odeslání na backend
                    }
                }

                const interests = Array.from(document.getElementById('interests').selectedOptions).map(o => o.value);
                if (interests.length === 0) {
                    alert("Vyberte alespoň jednu preferenci (Ctrl + klik pro více).");
                    return;
                }
                const budgetVal = document.getElementById('budget-max').value;
                const travelVal = document.getElementById('max-travel').value;

                const req = {
                    location_id: parseInt(document.getElementById('loc-select').value),
                    time_from: `${date} ${timeFrom}:00`,
                    time_to: `${date} ${document.getElementById('time-to').value}:00`,
                    transport_mode: document.getElementById('transport').value,
                    route_type: document.getElementById('route-type').value,
                    interests: interests,
                    budget_max: budgetVal === '' ? null : parseFloat(budgetVal),
                    max_travel_time_mins: travelVal === '' ? null : parseInt(travelVal),
                    difficulty: document.getElementById('difficulty').value,
                    willing_to_pay_entry: document.getElementById('willing-pay').checked,
                    has_children: document.getElementById('has-children').checked
                };

                const btn = document.getElementById('btn-generate');
                btn.disabled = true; btn.textContent = 'Plánuji...';
                let res, data;
                try {
                    res = await fetch('http://localhost:8080/api/planner', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(req)
                    });
                    data = await res.json();
                } catch (e) {
                    alert("Backend neodpovídá. Běží Docker kontejnery?");
                    return;
                } finally {
                    btn.disabled = false; btn.textContent = 'Vygenerovat přes Backend';
                }

                document.getElementById('results').classList.remove('hidden');
                document.getElementById('raw-json').textContent = JSON.stringify(data.waypoints, null, 2);
                
                const itinDiv = document.getElementById('itinerary');
                itinDiv.innerHTML = '';

                if (!res.ok) {
                    const detail = typeof data.detail === 'string' ? data.detail : (data.error || JSON.stringify(data.detail || data));
                    itinDiv.innerHTML = `<div class="bg-red-100 text-red-800 border border-red-200 p-4 rounded-xl font-bold">⚠️ Chyba: ${detail}</div>`;
                    return;
                }
                
                if (data.message) {
                    let weatherBg = data.weather_status === 'BAD_WEATHER' ? 'bg-red-100 text-red-800 border-red-200' : 'bg-blue-100 text-blue-800 border-blue-200';
                    let weatherIcon = data.weather_status === 'BAD_WEATHER' ? '🌧️' : (data.weather_status === 'UNKNOWN' ? '❓' : '☀️');
                    itinDiv.innerHTML += `<div class="${weatherBg} border p-4 rounded-xl mb-4 font-bold">
                        ${weatherIcon} Zpráva Meteostanice: ${data.message}
                    </div>`;
                }
                
                if(!data.itinerary || !data.itinerary.some(i => i.type === 'poi')) {
                    const reason = data.empty_reason || 'Žádná trasa nebyla vygenerována.';
                    itinDiv.innerHTML += `<div class="text-red-500 font-bold p-4">${reason}</div>`;
                    return;
                }

                const catLabels = {SIGHTSEEING: '🏛️ Památka', GASTRO: '☕ Gastro', RUNNING: '🏃 Běh', FESTIVAL: '🎉 Festival', PARK: '🌳 Příroda'};
                const modeIcons = {WALK: '🚶', BIKE: '🚲', CAR: '🚗'};

                itinDiv.innerHTML += `<div class="bg-emerald-50 text-emerald-800 border border-emerald-200 p-4 rounded-xl font-bold flex justify-between">
                    <span>⏱️ Naplánováno: ${data.total_planned_time} min (volný čas: ${data.remaining_free_time_mins} min)</span>
                    <span>💰 Odhad nákladů: ${Math.round(data.total_estimated_cost || 0)} Kč</span>
                </div>`;

                data.itinerary.forEach(i => {
                    if (i.type === 'travel' || i.type === 'travel_return') {
                        itinDiv.innerHTML += `<div class="bg-slate-200 p-3 rounded text-sm font-semibold text-slate-700 text-center">
                            ${modeIcons[i.mode] || '🚗'} ${i.title || 'Přesun'}: ${i.start} - ${i.end} (${i.duration_mins} min, ${i.distance_km} km)
                        </div>`;
                    } else if (i.type === 'wait') {
                        itinDiv.innerHTML += `<div class="bg-amber-50 p-3 rounded text-sm font-semibold text-amber-800 text-center">
                            ⏳ ${i.title}: ${i.start} - ${i.end} (${i.duration_mins} min)
                        </div>`;
                    } else {
                        let img = i.image_url ? `<img src="${i.image_url}" onerror="this.remove()" class="w-full h-40 object-cover mt-2 rounded">` : '';
                        const cost = i.estimated_cost > 0 ? `${Math.round(i.estimated_cost)} Kč` : 'Zdarma';
                        itinDiv.innerHTML += `<div class="bg-white p-4 rounded shadow border border-indigo-100">
                            <div class="flex justify-between text-sm">
                                <span class="text-indigo-600 font-bold">${i.start} - ${i.end}</span>
                                <span class="text-slate-500 font-semibold">${catLabels[i.category] || i.category} · ${cost}</span>
                            </div>
                            <h3 class="text-lg font-bold">${i.title}</h3>
                            ${i.address ? `<p class="text-xs text-slate-500">📍 ${i.address}</p>` : ''}
                            ${img}
                            ${i.description ? `<p class="text-sm text-slate-600 mt-2">${i.description}</p>` : ''}
                            ${i.website ? `<a href="${i.website}" target="_blank" rel="noopener" class="text-sm text-indigo-600 underline">Web místa</a>` : ''}
                        </div>`;
                    }
                });

                // Vykreslení interaktivní mapy přes Leaflet
                if (mapInstance) {
                    mapInstance.remove(); // Smazat starou mapu, pokud existuje
                }
                
                const wps = data.waypoints;
                if (wps && wps.length > 0) {
                    // Inicializace mapy na první bod
                    mapInstance = L.map('map').setView([wps[0].lat, wps[0].lng], 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(mapInstance);

                    const latlngs = [];
                    wps.forEach((wp, index) => {
                        let markerColor = wp.type === 'START' || wp.type === 'END_LOOP' ? 'blue' : 'red';
                        L.marker([wp.lat, wp.lng]).addTo(mapInstance)
                         .bindPopup(`<b>${index + 1}. ${wp.name}</b>`);
                        latlngs.push(L.latLng(wp.lat, wp.lng));
                    });

                    // Vykreslení REÁLNÉ trasy po silnicích/cestách přes OSRM routing
                    L.Routing.control({
                        waypoints: latlngs,
                        routeWhileDragging: false,
                        addWaypoints: false,
                        fitSelectedRoutes: true,
                        showAlternatives: false,
                        show: false, // Skryjeme textové navigační instrukce (chceme jen čáru na mapě)
                        lineOptions: {
                            styles: [{color: 'indigo', weight: 4}]
                        },
                        createMarker: function() { return null; } // Zamezíme duplikování špendlíků
                    }).addTo(mapInstance);
                    
                    // Generování Google Maps navigační URL
                    // Dokumentace: https://developers.google.com/maps/documentation/urls/get-started#directions-action
                    let travelModeMaps = 'driving';
                    if (data.transport_mode === 'WALK') travelModeMaps = 'walking';
                    if (data.transport_mode === 'BIKE') travelModeMaps = 'bicycling';
                    
                    const origin = `${wps[0].lat},${wps[0].lng}`;
                    const destination = `${wps[wps.length - 1].lat},${wps[wps.length - 1].lng}`;
                    
                    let waypointsParam = '';
                    if (wps.length > 2) {
                        const midWaypoints = wps.slice(1, -1).map(w => `${w.lat},${w.lng}`).join('|');
                        waypointsParam = `&waypoints=${midWaypoints}`;
                    }
                    
                    const gmapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypointsParam}&travelmode=${travelModeMaps}`;
                    document.getElementById('nav-btn').href = gmapsUrl;
                }
            });
        });
    </script>
</body>
</html>
