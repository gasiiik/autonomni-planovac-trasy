services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: krusnoplan
      MARIADB_USER: api_user
      MARIADB_PASSWORD: api_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  php_gateway:
    build:
      context: ./gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/src:/var/www/html
    depends_on:
      - db

  python_engine:
    build:
      context: ./engine
    ports:
      - "8000:8000"
    volumes:
      - ./engine:/app
    environment:
      - DATABASE_URL=mysql+pymysql://api_user:api_password@db/krusnoplan
      - AUTO_IMPORT=1                # při startu stáhne data z DataZápad, pokud chybí nebo jsou starší než 7 dní
      - AUTO_IMPORT_MAX_AGE_DAYS=7
      - PYTHONUNBUFFERED=1           # průběh importu hned v `docker compose logs`
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
    ports:
      - "5173:80"
    depends_on:
      - php_gateway

volumes:
  mariadb_data:
