server {
    listen 80;

    # Fotky míst přes náš server (engine je stáhne jednou a uloží) - viz backend/engine/app/photos.py
    location /photos {
        resolver 127.0.0.11 valid=30s;          # DNS Dockeru - engine se najde, i když startuje později
        set $engine http://python_engine:8000;
        proxy_pass $engine;
        proxy_read_timeout 60s;
        expires 30d;
    }

    # React Router (SPA): neznámé cesty -> index.html
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
